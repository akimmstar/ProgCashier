<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0284c7" />
    <title>Cashier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <i style="--x: 8%; --s: 18px; --d: 22s; --t: 0s"></i
      ><i style="--x: 20%; --s: 32px; --d: 30s; --t: -9s"></i>
      <i style="--x: 34%; --s: 14px; --d: 24s; --t: -4s"></i
      ><i style="--x: 48%; --s: 26px; --d: 34s; --t: -15s"></i>
      <i style="--x: 62%; --s: 20px; --d: 27s; --t: -7s"></i
      ><i style="--x: 75%; --s: 38px; --d: 36s; --t: -20s"></i>
      <i style="--x: 86%; --s: 16px; --d: 25s; --t: -11s"></i
      ><i style="--x: 94%; --s: 24px; --d: 31s; --t: -2s"></i>
    </div>
    <div class="progress" id="prog"></div>
    <div class="app">
      <header>
        <div class="brand">
          <div class="logo"></div>
          Program Kasir
        </div>
        <div class="nav-wrap" id="navWrap">
          <button
            class="nav-toggle"
            type="button"
            id="navToggle"
            data-act="toggleNav"
            aria-label="Buka menu navigasi"
            aria-expanded="false"
            aria-controls="navMenu"
          >
            <span class="hamburger" aria-hidden="true"
              ><span></span><span></span><span></span
            ></span>
            <span class="nav-toggle-title">Menu</span>
            <span class="nav-selected" id="navSelected" aria-hidden="true"
              >Kasir</span
            >
            <svg
              class="nav-chevron"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <nav
            class="nav-menu"
            id="navMenu"
            aria-label="Navigasi halaman"
            aria-hidden="true"
            inert
          >
            <div class="tabs">
              <button
                type="button"
                class="tab on"
                data-act="view"
                data-v="kasir"
                aria-current="page"
              >
                <svg
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="4" y="9" width="16" height="11" rx="2" />
                  <path d="M7 9V5h10v4M8 13h8M8 16h3" />
                </svg>
                <span>Kasir</span
                ><span class="nav-active-mark" aria-hidden="true">✓</span>
              </button>
              <button type="button" class="tab" data-act="view" data-v="kelola">
                <svg
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 6h13M8 12h13M8 18h13" />
                  <path d="m3 6 1 1 2-2M3 12h3M3 18h3" />
                </svg>
                <span>Kelola menu</span
                ><span class="nav-active-mark" aria-hidden="true">✓</span>
              </button>
              <button
                type="button"
                class="tab"
                data-act="view"
                data-v="riwayat"
              >
                <svg
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                </svg>
                <span>Riwayat</span
                ><span class="nav-active-mark" aria-hidden="true">✓</span>
              </button>
            </div>
          </nav>
        </div>
      </header>

      <main id="v-kasir" class="layout">
        <section class="panel reveal">
          <div class="tools">
            <input
              id="q"
              class="search"
              type="search"
              placeholder="Cari menu…"
              aria-label="Cari menu"
            />
          </div>
          <div id="chips" class="chips"></div>
          <div id="grid" class="grid"></div>
        </section>
        <aside id="cartPanel" class="panel cart reveal">
          <h2>Daftar belanja</h2>
          <div id="cart"></div>
          <div class="cartfoot">
            <div class="total">
              <span>Total</span><span id="total">Rp 0</span>
            </div>
            <div class="acts">
              <button class="btn danger" data-act="clear">Kosongkan</button
              ><button id="payBtn" class="btn pay" data-act="pay">Bayar</button>
            </div>
          </div>
        </aside>
      </main>

      <main id="v-riwayat" class="hide">
        <section class="panel reveal">
          <div class="hhead">
            <h2 class="h" style="margin: 0">Riwayat transaksi</h2>
            <div class="seg">
              <button class="segb on" data-act="hmode" data-m="harian">
                Harian</button
              ><button class="segb" data-act="hmode" data-m="mingguan">
                Mingguan</button
              ><button class="segb" data-act="hmode" data-m="bulanan">
                Bulanan
              </button>
            </div>
          </div>
          <div id="stats" class="stats"></div>
          <div id="chart" class="chart"></div>
        </section>
        <section class="panel reveal" style="margin-top: 20px">
          <h2 class="h" id="lTitle">Transaksi per hari</h2>
          <div id="hlist"></div>
          <div
            class="row"
            style="justify-content: space-between; align-items: center"
          >
            <span class="note"
              >Nomor transaksi kembali ke #0001 setiap hari.</span
            ><span
              ><button class="btn ghost sm" data-act="demo">
                Isi data contoh
              </button>
              <button class="btn danger sm" data-act="wipe">
                Hapus riwayat
              </button></span
            >
          </div>
        </section>
      </main>

      <main id="v-kelola" class="panel reveal hide">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
          "
        >
          <h2 class="h" style="margin: 0">Daftar menu</h2>
          <button class="btn" data-act="add">Tambah menu</button>
        </div>
        <div class="wrap">
          <table>
            <thead>
              <tr>
                <th>Menu</th>
                <th>Kategori</th>
                <th>Harga</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="dock" class="dock">
      <div><small id="dockN"></small><b id="dockT"></b></div>
      <button class="btn" data-act="toCart">Lihat belanja</button>
    </div>

    <div id="mForm" class="modal">
      <div class="box">
        <h3 class="h" id="fTitle">Tambah menu</h3>
        <label>Gambar menu</label>
        <div class="pic">
          <img id="fPrev" class="thumb" alt="Pratinjau gambar" />
          <div>
            <input type="file" id="fFile" accept="image/*" hidden /><button
              class="btn ghost sm"
              data-act="pick"
            >
              Unggah foto</button
            ><button
              id="unpicBtn"
              class="btn ghost sm"
              data-act="unpic"
              disabled
            >
              Pakai ilustrasi
            </button>
          </div>
        </div>
        <label for="fEmo">Emoji cadangan</label
        ><input id="fEmo" maxlength="4" value="🍽️" />
        <label for="fName">Nama menu</label
        ><input id="fName" placeholder="Contoh: Nasi goreng" />
        <label for="fCat">Kategori</label
        ><input id="fCat" list="cats" placeholder="Contoh: Makanan" /><datalist
          id="cats"
        ></datalist>
        <label for="fPrice">Harga (Rp)</label
        ><input
          id="fPrice"
          type="number"
          min="0"
          step="500"
          inputmode="numeric"
        />
        <div class="row">
          <button class="btn ghost" data-act="closeForm">Batal</button
          ><button class="btn" data-act="saveForm">Simpan</button>
        </div>
      </div>
    </div>

    <div id="mPay" class="modal">
      <div class="box">
        <h3 class="h">Pembayaran</h3>
        <div class="sum">
          <div><span>Total tagihan</span><b id="pTotal"></b></div>
        </div>
        <label for="pCash">Uang diterima (Rp)</label
        ><input id="pCash" type="number" min="0" inputmode="numeric" />
        <div class="quick" id="quick"></div>
        <div class="sum">
          <div><span>Kembalian</span><b id="pChange">Rp 0</b></div>
        </div>
        <div class="row">
          <button class="btn ghost" data-act="closePay">Batal</button
          ><button id="confirmPay" class="btn" data-act="confirm" disabled>
            Konfirmasi bayar
          </button>
        </div>
      </div>
    </div>

    <div id="mOk" class="modal">
      <div class="box success">
        <div class="check">
          <svg viewBox="0 0 52 52"><path d="M14 27l9 9 17-19" /></svg>
        </div>
        <h3>Pembayaran berhasil</h3>
        <div style="color: var(--muted)" id="okNo"></div>
        <div class="sum" id="okSum"></div>
        <button class="btn" style="width: 100%" data-act="done">
          Transaksi baru
        </button>
      </div>
    </div>

    <script src="js/art.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
